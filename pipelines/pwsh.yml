# ==============================================================================
# PIPELINE: Diagnostic Test - PowerShell & Agent Health
# FILE: pwsh.yml
# ------------------------------------------------------------------------------
# TRIGGER: Manual execution only (trigger: none)[cite: 5]
# AGENT POOL: SelfHosted[cite: 5]
#
# WHAT THIS PIPELINE DOES:
# 1. Prints host environment user (`whoami`)[cite: 5].
# 2. Confirms PowerShell Core (`pwsh`) installation and version[cite: 5].
# 3. Executes a test script block to verify basic inline task execution[cite: 5].
# ==============================================================================

trigger: none
pr: none

pool:
  name: SelfHosted

steps:
- task: PowerShell@2
  displayName: Test pwsh on ADO runner
  inputs:
    targetType: inline
    pwsh: true
    script: |
      Write-Host "ADO runner is working"
      whoami
      pwsh --version
      pwsh -c "Write-Host 'PowerShell is working on ADO'"