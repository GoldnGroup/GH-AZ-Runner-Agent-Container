# ==============================================================================
# PIPELINE: Automated Dev Branch Sync to GitHub
# FILE: GH-AZ Runner - Sync Dev to GitHub.yml
# ------------------------------------------------------------------------------
# TRIGGER: Automatic on push to 'dev' branch[cite: 2]
# REQUIRED BRANCH: refs/heads/dev[cite: 2]
# AGENT POOL: SelfHosted[cite: 2]
# VARIABLE GROUP: github-actions-runner-azure-pipelines-agent[cite: 2]
#
# WHAT THIS PIPELINE DOES:
# 1. Validates that the build source branch is 'refs/heads/dev'[cite: 2].
# 2. Automatically force-pushes the latest 'dev' branch code to GitHub:
#    - Target Repo: https://github.com/$(GITHUB_REPO).git[cite: 2]
#    - Target Branch: dev[cite: 2]
# ==============================================================================

trigger:
  branches:
    include:
      - dev

pr: none

pool:
  name: SelfHosted

variables:
- group: github-actions-runner-azure-pipelines-agent

steps:
- checkout: self
  fetchDepth: 0

- task: PowerShell@2
  displayName: Sync dev branch to GitHub
  inputs:
    targetType: inline
    pwsh: true
    script: |
      $ErrorActionPreference = "Stop"

      if ("$(Build.SourceBranch)" -ne "refs/heads/dev") {
        throw "Dev sync must be run from dev only. Current branch: $(Build.SourceBranch)"
      }

      git config user.name "goldngroup-release-bot"
      git config user.email "release-bot@goldngroup.local"

      $githubUrl = "https://$env:GITHUB_TOKEN@github.com/$(GITHUB_REPO).git"

      if (git remote | Select-String "^github$") {
        git remote set-url github $githubUrl
      } else {
        git remote add github $githubUrl
      }

      git push github HEAD:dev --force

      Write-Host "Published ADO dev to GitHub dev: $(GITHUB_REPO)"
  env:
    GITHUB_TOKEN: $(GITHUB_TOKEN)